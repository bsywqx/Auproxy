name: 自动更新代理配置

on:
  schedule:
    # 每 4 小时运行一次 (UTC), 可根据需要调整
    - cron: '0 */4 * * *'
  workflow_dispatch:     # 支持手动触发
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 拉取完整历史, 避免分叉时 pull 失败

      - name: 运行配置更新脚本 (PowerShell 跨平台)
        shell: pwsh
        run: |
          ./update.ps1

      - name: 提交并推送更新 (带冲突处理)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "无配置变化, 跳过提交"
            exit 0
          fi

          echo "有配置更新, 提交..."
          git commit -m "chore: 自动同步代理配置 $(date -u +'%Y-%m-%d %H:%M UTC')"

          # 拉取远端最新并重放本地提交, 解决 "fetch first" 分叉冲突
          echo "拉取远端最新..."
          git pull --rebase || {
            echo "自动整合失败, 尝试强推最新提交...";
            git push --force-with-lease
            exit 0
          }

          echo "推送..."
          git push